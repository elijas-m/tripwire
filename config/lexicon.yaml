# Narrative/feature headlines: retrospective or explainer pieces, not event bulletins.
# Matched against the title only, regardless of source tier; tripwires still bypass.
feature_headlines:
  en:
    - 're:^how\b.{0,140}\b(?:changed|transformed|reshaped|redefined|remade|altered|revived|is changing|are changing)\b'
    - 're:^what\b.{0,100}\b(?:taught|teaches|revealed|changed)\b'
    - 're:^(?:\d+|two|three|four|five|six|seven|eight|nine|ten)\s+(?:years?|decades?)\s+(?:after|later)\b'
    - 're:^(?:years?|decades?)\s+(?:after|later)\b'
    - lessons from
    - lessons learned
    - what we learned
    - anniversary
    - retrospectiv*
    - oral history
    - inside story
    - behind the scenes
  ru:
    - 're:^как\b.{0,140}\b(?:изменил|изменила|изменило|преобразил|перестроил|повлиял)\b'
    - 're:^спустя\b'
    - годовщин*
    - ретроспектив*
    - история одного
    - извлеченные уроки
    - уроки из

# Research publications (studies, analyses, reviews) are not operational alerts.
research_headlines:
  en:
    - 're:^research\s*:'
    - 're:^research (?:and analysis|shows|finds|suggests|reveals|indicates)\b'
    - 're:^(?:a\s+)?(?:new\s+)?study\b'
    - 're:^(?:survey|analysis)\s*:'
    - 're:^(?:qualitative|quantitative|retrospective|prospective)\s+(?:study|analysis)\b'
    - 're:^(?:systematic\s+review|meta[- ]analysis|literature\s+review|case\s+study)\b'
    - 're:^(?:scientists|researchers)\b'
    - 're:\b(?:study|survey|analysis|research)\s+(?:finds|found|shows|showed|suggests|reveals|revealed|indicates)\b'
    - 're:\baccording to (?:a|the|this) (?:new\s+|recent\s+)?(?:study|analysis|research|survey)\b'
    - 're:\bpeer[- ]reviewed\b'
    - 're:\bpreprint\b'
    - 're:\bpublished in (?:the\s+)?(?:journal|lancet|nature|science|bmj|jama|nejm|plos)\b'
    - 're:\bcollaborat\w*\s+to\s+(?:develop|standardize|standardise|advance|strengthen)\b'
    - 're:\b(?:standardized|standardised)\s+(?:score|framework|guideline|protocol|tool|approach)\b'
    - 're:\bvaccine (?:research|development|pipeline)\b'
  ru:
    - 're:^исследование\b'
    - 're:^исследователи\b'
    - 're:^ученые\b'
    - 're:^(?:качественный|количественный|ретроспективный|проспективный)\s+анализ\b'
    - 're:^(?:систематический\s+обзор|мета-?анализ|обзор\s+литературы)\b'
    - 're:\bпо данным (?:нового\s+)?(?:исследования|анализа|обзора)\b'
    - 're:\bв журнале\b'
    - 're:\bпрепринт\w*\b'
    - 're:\bрецензируем\w*\b'

# Routine governance meetings (working groups, committee sessions, assemblies)
# and ceremonial speeches (opening remarks, webinars) are procedure, not an
# incident. Matched against the title only, at any tier; tripwires and domain
# rules still bypass. Emergency/extraordinary meetings are restored by
# procedural_exceptions.
procedural_headlines:
  en:
    - 're:\b(?:first|second|third|fourth|fifth|sixth|seventh|eighth|ninth|tenth|eleventh|twelfth|\d{1,2}(?:st|nd|rd|th))\s+(?:meeting|session)\b'
    - 're:\bintergovernmental\s+(?:working|negotiating)\s+group\b'
    - 're:\bworking\s+group\s+(?:on|for)\b'
    - 're:\b(?:meeting|session)\s+of\s+(?:the\s+)?(?:\w+\s+){0,4}(?:committee|group|assembly|council|board|panel|commission)\b'
    - 're:\b(?:governing\s+body|executive\s+board|world\s+health\s+assembly|regional\s+committee)\b'
    - 're:\bconference\s+of\s+the\s+parties\b'
    - 're:\bplenary\s+(?:session|meeting)\b'
    - 're:\b(?:convenes|holds|opens)\s+(?:its\s+)?(?:\w+\s+){0,3}(?:meeting|session)\b'
    - 're:\bopening\s+(?:remarks|statement|address|speech)\b'
    - 're:\b(?:closing|concluding|keynote|welcoming|introductory)\s+(?:remarks|address|speech)\b'
    - 're:\bremarks\s+(?:at|by|to|during|for)\b'
    - 're:\b(?:speech|address)\s+(?:at|to|by)\s+(?:the\s+)?(?:\w+\s+){0,8}(?:meeting|session|briefing|conference|forum|summit|assembly|council|workshop|webinar|dialogue)\b'
    - 're:\b(?:webinar|online\s+(?:seminar|event))\b'
  ru:
    - 're:(?:^|\s)(?:первое|второе|третье|четвертое|пятое|шестое|седьмое|восьмое|девятое|десятое|одиннадцатое|двенадцатое|\d+[- ]?(?:е|й|я|ое))\s+совещани'
    - 're:межправительственн\w*\s+рабоч\w*\s+групп'
    - 're:рабоч\w*\s+групп\w*\s+(?:по|для)'
    - 're:(?:совещание|сессия|заседание)\s+.{0,80}(?:комитет|совет|групп|ассамбле|комисси)'
    - 're:конференци\w*\s+сторон'
    - 're:пленарн\w*\s+(?:заседание|сессия)'
    - 're:(?:созывает|проводит|открывает)\s+.{0,40}(?:совещание|сессию|заседание)'
    - 're:(?:вступительн|приветственн|заключительн|ключев)\w*\s+слов\w*'
    - 're:(?:выступление|речь|доклад)\s+на\s+.{0,60}(?:совещани|сесси|конференци|брифинг|форум|ассамбле)'
    - 're:(?:вебинар|онлайн-семинар)'
procedural_exceptions:
  en:
    - 're:\b(?:emergency|urgent|extraordinary|crisis)\b'
  ru:
    - 're:(?:внеочередн|экстренн|чрезвычайн)'

