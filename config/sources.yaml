# Operational source registry (Stage 0 verified 2026-10-24).
# type: rss | json | html | ws | telegram | market
# tier: 0 official fact | 1 gov/intergov press | 2 agencies/official channels | 3 OSINT/markets
# adaptive: intervals shrink 3-5x while the theater is WARNING/CRITICAL.
version: 1

defaults:
  method: GET
  timeout_s: 25
  max_items: 30
  jitter: 0.2
  adaptive: true
  lang: en
  max_age_hours: 48
  silence_hours: 72
  headers:
    Accept-Encoding: gzip, deflate
    Accept-Language: en-US,en;q=0.9,ru;q=0.8,he;q=0.7

sources:
  # ---------------- Seismic / tsunami / volcano ----------------
  - id: usgs_sig_hour
    name: "USGS Significant (1h)"
    type: json
    parser: usgs_geojson
    url: "https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/significant_hour.geojson"
    tier: 0
    theater: NATURE
    category: earthquake
    interval_s: 60
    max_age_hours: 3
    adaptive: false
    lang: en

  - id: usgs_45_hour
    name: "USGS M4.5+ (1h)"
    type: json
    parser: usgs_geojson
    url: "https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_hour.geojson"
    tier: 0
    theater: NATURE
    category: earthquake
    interval_s: 120
    max_age_hours: 3
    adaptive: false

  - id: usgs_45_day
