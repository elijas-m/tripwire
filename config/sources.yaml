  - id: tradingview
    name: "TradingView scanner"
    type: market
    parser: tradingview_json
    method: POST
    url: "https://scanner.tradingview.com/global/scan"
    headers:
      Content-Type: application/json
    body: '{"symbols":{"tickers":["ICEEUR:BRN1!","NYMEX:CL1!","TVC:GOLD","TVC:SILVER","TVC:VIX","FX_IDC:USDRUB","FX_IDC:USDILS","NYMEX:NG1!","TVC:DXY"],"query":{"types":[]}},"columns":["close","change","change_abs"]}'
    tier: 3
    theater: MARKETS
    category: market
    interval_s: 600
    max_age_hours: 1
    adaptive: false
    market_symbols:
      "ICEEUR:BRN1!": {name: Brent, kind: oil}
      "NYMEX:CL1!": {name: WTI, kind: oil}
      "TVC:GOLD": {name: Gold, kind: metal}
      "TVC:SILVER": {name: Silver, kind: metal}
      "TVC:VIX": {name: VIX, kind: vol}
      "FX_IDC:USDRUB": {name: "USD/RUB", kind: fx}
      "FX_IDC:USDILS": {name: "USD/ILS", kind: fx}
