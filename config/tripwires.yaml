# Layer A — hard tripwires. A match bypasses scoring and fires CRITICAL immediately.
# Types:
#   regex   — match against title+body; optional source_ids/source_domains, max_tier, negate_regex
#   numeric — boolean expression over the event numeric_payload (JSON fields become names)
#   handler — named handler implemented in tripwire.py for multi-event / stateful checks
# Every entry: id, theater, level, cooldown_min, why (shown in /why and in the alert).
version: 1

tripwires:
  # ---------------- Europe / Russia ----------------
  - id: TW-EU-ART5
    type: regex
    theater: EU_RU
    level: CRITICAL
    cooldown_min: 60
    source_domains: [nato.int]
    max_tier: 0
    regex: >-
      (?is)(\barticle\s*(5|five)\b.{0,100}\b(invok|trigger|activat|appl)\w*|\b(invok|trigger|activat)\w*.{0,100}\barticle\s*(5|five)\b)
    negate_regex: '(?i)(exercise|drill|simulation|war ?game|scenario|anniversary|hypothetical|учени|тренировк|сценарий)'
    why: "Задействована Статья 5 Вашингтонского договора. Это запускает коллективные консультации и помощь союзников, но не означает автоматического вступления всех стран в боевые действия."
    one_liner: "НАТО задействует Статью 5"
    horizon: tactical
    refute: "Официальное опровержение атаки и отсутствие подтверждения со стороны НАТО."
    next_tripwire: "Объявление всеобщей мобилизации или применение ядерного оружия."

  - id: TW-EU-ART4
    type: regex
    theater: EU_RU
    level: WARNING
    cooldown_min: 60
    source_domains: [nato.int]
    max_tier: 0
    regex: >-
      (?is)(\barticle\s*(4|four)\b.{0,100}\b(invok|request|consult)\w*|\b(invok|request|consult)\w*.{0,100}\barticle\s*(4|four)\b)
    negate_regex: '(?i)(exercise|drill|simulation|war ?game|scenario|anniversary|учени|тренировк|сценарий)'
    why: "Статья 4 — консультации по угрозе. Пока не война, но признак серьёзного кризиса."
    one_liner: "НАТО проводит консультации по Статье 4"

  - id: TW-EU-MOBILIZATION
    type: regex
    theater: EU_RU
    level: CRITICAL
    cooldown_min: 120
    source_ids: [kremlin_events, kremlin_acts, mod_russia_tg]
    max_tier: 1
    regex: >-
      (?i)(всеобщ\w*\s+мобилизац|объявлен\w*\s+(всеобщ\w*\s+)?мобилизац|указ\w*.{0,60}мобилизац|военн\w+\s+положени|объявлен\w*.{0,30}военн\w+\s+положени)
    why: "Всеобщая мобилизация или военное положение в РФ — переход к большой войне."
    one_liner: "В РФ объявлена мобилизация / военное положение"
    horizon: structural
    refute: "Официальное опровержение или отмена указа."
    next_tripwire: "Военное положение в стране НАТО или полное закрытие воздушного пространства."

  - id: TW-EU-MARTIAL-LAW
    type: regex
    theater: EU_RU
    level: CRITICAL
    cooldown_min: 120
    max_tier: 1
    require_country_in: NATO_EU
    regex: >-
      (?is)\b(martial law|state of war|военное положение|wojenn\w+|karo pad[eė]tis|sõjaseisukord|krigstillstånd)\b
    negate_regex: '(?i)(exercise|drill|simulation|scenario|anniversary|учени|тренировк|сценарий|considered|may|might|could|обсужда|рассматрива)'
    why: "Военное положение в стране НАТО/ЕС — официальный переход государства в режим войны."
    one_liner: "Военное положение в стране НАТО/ЕС"

  - id: TW-EU-AIRSPACE-FULL
    type: handler
    handler: airspace_full_closure
    theater: EU_RU
    level: CRITICAL
    cooldown_min: 120
    countries: [RU, BY, UA, PL, LT, LV, EE, FI, "NO", SE, RO, MD, DE, CZ, SK, HU]
    why: "Полное закрытие воздушного пространства страны для гражданской авиации — признак начала боевых действий."
    one_liner: "Закрыто воздушное пространство страны"
    horizon: tactical
    refute: "Отмена NOTAM и возобновление полётов."
    next_tripwire: "Наземная операция или удар по территории страны НАТО."

  - id: TW-EU-ORDERED-DEPARTURE
    type: handler
    handler: ordered_departure
    theater: EU_RU
    level: WARNING
    cooldown_min: 180
    capitals: [Moscow, Kyiv, Warsaw, Vilnius, Riga, Tallinn, Helsinki, Bucharest, Chisinau]
    regex: '(?i)(ordered departure|authorized departure|приказ\w*.{0,30}(эвакуац|выезд)|предписан\w*.{0,30}(эвакуац|выезд))'
    why: "Госдеп/МИД предписал выезд персонала посольства — один из лучших ранних индикаторов войны."
    one_liner: "Предписан выезд персонала посольства"
    horizon: structural
    refute: "Отмена приказа и возвращение персонала."
    next_tripwire: "Полное закрытие воздушного пространства."

  - id: TW-EU-STRIKE-NATO
    type: handler
    handler: strike_on_nato
    theater: EU_RU
    level: CRITICAL
    cooldown_min: 60
    regex: >-
      (?is)\b(struck|attacked|hit|shelled|bombed|missile strike|drone attack|нанес\w* удар|атакова\w*|обстрел\w*|удар\w*)
    max_tier: 1
    why: "Сообщается об ударе по территории страны НАТО с жертвами. Ожидается официальная оценка обстоятельств; система не делает вывод о casus foederis."
    one_liner: "Сообщение об ударе по территории страны НАТО"

  - id: TW-EU-INVASION
    type: regex
    theater: EU_RU
    level: CRITICAL
    cooldown_min: 120
    source_ids: [kremlin_events, kremlin_acts, mod_russia_tg]
    max_tier: 1
    regex: >-
      (?is)(made a decision|decided|i have decided|принял\w*\s+решени\w*|принято\s+решени\w*).{0,80}(carry out|conduct|launch|start|проведени\w*|начал\w*).{0,40}(special military operation|специальн\w*\s+военн\w*\s+операц\w*)|(launched|started|began|начал\w*).{0,40}(full-scale invasion|полномасштабн\w*\s+вторжени\w*).{0,40}(ukrain|украин)
    negate_regex: '(?i)(exercise|drill|simulation|scenario|anniversary|учени|тренировк|сценарий|годовщин)'
    why: "Официальное объявление о начале военной операции против Украины — начало полномасштабного конфликта."
    one_liner: "Начало полномасштабной войны РФ против Украины"
    horizon: tactical
    refute: "Официальное опровержение начала операции или её прекращение в течение 24 ч."
    next_tripwire: "Закрытие воздушного пространства или применение ядерного оружия."

  - id: TW-RU-NUCLEAR-USE
    type: regex
    theater: EU_RU
    level: CRITICAL
    cooldown_min: 240
    max_tier: 1
    regex: >-
      (?is)\b(nuclear (strike|attack)|used nuclear weapons?|nuclear weapons? (?:were |have been |was |has been )?used|use of (?:tactical |a )?nuclear weapons?|tactical nuclear weapons? use|ядерн\w+ (удар|атак)|применен\w+ ядерн\w+ оружи|использовани\w+ ядерн\w+ оружи|תקיפה גרעינית)\b
    negate_regex: '(?i)(exercise|drill|simulation|scenario|doctrine|analyst|opinion|risk of|could|may|might|warn|учени|тренировк|сценарий|доктрин|аналитик|риск|может|могут)'
    why: "Применение ядерного оружия — стратегическая точка невозврата."
    one_liner: "Применено ядерное оружие"
    horizon: tactical
    refute: "Опровержение применения и отсутствие подтверждения МАГАТЭ или сейсмических данных."
    next_tripwire: "Ответный удар НАТО или задействование Статьи 5."

  # ---------------- Israel / Iran ----------------
