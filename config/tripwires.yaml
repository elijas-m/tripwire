      (?is)(\b(ras tanura|abqaiq|jubail|рас[- ]танура|абкайк|джубейл|ג'ובייל|ראס תנאורה)\b)
      .{0,160}
      (\b(attack|strike|hit|explosion|fire|sabotage|drone|missile|атак\w*|удар\w*|взрыв\w*|пожар\w*|диверс\w*)\b)
    negate_regex: '(?i)(exercise|drill|simulation|scenario|учени|тренировк|сценарий)'
