    category: earthquake
    interval_s: 300
    max_age_hours: 24

  - id: emsc_ws
    name: "EMSC WebSocket"
    type: ws
    parser: emsc_ws
    url: "wss://www.seismicportal.eu/standing_order/websocket"
    tier: 0
    theater: NATURE
    category: earthquake
    interval_s: 0
    enabled: false          # enabled after Stage-1 live format confirmation
    lang: en

  - id: emsc_rest
    name: "EMSC FDSN (latest)"
    type: json
    parser: emsc_geojson
    url: "https://www.seismicportal.eu/fdsnws/event/1/query?format=json&limit=20&orderby=time"
    tier: 0
    theater: NATURE
    category: earthquake
    interval_s: 600
    max_age_hours: 6

  - id: ingv_fdsn
    name: "INGV FDSN M4+"
    type: json
    parser: ingv_geojson
    url: "https://webservices.ingv.it/fdsnws/event/1/query?format=geojson&limit=20&orderby=time&minmag=4"
