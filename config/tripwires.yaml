    max_tier: 2
    regex: >-
      (?is)(\b(ground (operation|offensive|invasion|incursion)|наземн\w+ (операц|наступлен|вторжен)|מבצע קרקעי|פלישה קרקעית)\b)
      .{0,160}
      (\b(iran|lebanon|hezbollah|gaza|syria|yemen|иран|ливан|хизбалл|газа|сирия|йемен)\b)
    negate_regex: '(?i)(exercise|drill|simulation|scenario|anniversary|учени|тренировк|сценарий|may|could|might|planned|planning|plans to|considering|обсужда|возможн|планир|якобы)'
    why: "Официально объявленная наземная операция в регионе — эскалация до региональной войны."
    one_liner: "Объявлена наземная операция"

  - id: TW-IL-IRAN-STRIKE
    type: regex
    theater: ISRAEL
    level: CRITICAL
    cooldown_min: 120
    max_tier: 2
    regex: >-
      (?is)(\b(israel|idf|израил|צה"ל)\b.{0,120}\b(struck|attacked|hit|нанес\w* удар|атакова\w*|תקף)\b.{0,120}\b(iran|iranian|иран|איראן)\b)
      |
      (\b(iran|iranian|иран|איראן)\b.{0,120}\b(struck|attacked|hit|нанес\w* удар|атакова\w*|תקף)\b.{0,120}\b(israel|израил|ישראל)\b)
    negate_regex: '(?i)(exercise|drill|simulation|scenario|учени|тренировк|сценарий|threaten|угрожа|reportedly|claims?|could|may|might)'
    why: "Взаимные удары Израиль↔Иран — переход к региональной войне."
    one_liner: "Удар Израиля по Ирану или Ирана по Израилю"
    horizon: tactical
    refute: "Прекращение взаимных ударов и подтверждённое прекращение огня."
    next_tripwire: "Высылка инспекторов МАГАТЭ или закрытие Ормузского пролива."

  # ---------------- Gulf / Saudi Arabia ----------------
  - id: TW-GULF-HORMUZ
    type: regex
    theater: GULF
    level: CRITICAL
    cooldown_min: 120
    max_tier: 2
    regex: >-
      (?is)((\bstrait of hormuz\b|ормузск\w+ пролив|מיצר הורמוז).{0,160}(\bclosed?\b|\bclosure\b|\bmining\b|\bmined\b|\bblocked\b|закрыт\w*|минир\w*|блокир\w*)
      |
      (\bclosed?\b|\bclosure\b|\bmining\b|\bmined\b|закрыт\w*|минир\w*).{0,160}(\bstrait of hormuz\b|ормузск\w+ пролив|מיצר הורמוז))
    negate_regex: '(?i)(exercise|drill|simulation|scenario|учени|тренировк|сценарий|reopen|открыт|возобновл)'
    why: "Закрытие или минирование Ормузского пролива — перекрытие ~20% мировой нефти."
