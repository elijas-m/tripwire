app:
  timezone: Europe/Moscow
  data_dir: /var/lib/tripwire
  log_level: INFO
  user_agent: "Tripwire/1.0 (global event monitor; ops contact in secrets.env)"
  heartbeat_s: 30
  health_check_s: 300
  degraded_recheck_s: 3600
  # Re-notify about the same failing/silent source at most once a day while the
  # problem persists. A recovered source that fails again notifies immediately.
  degraded_repeat_s: 86400
  max_age_hours: 48
  max_age_hours_seismic: 3
  digest_at: "09:00"
  selftest_interval_days: 7
  night: {start: 23, end: 7}
  vacuum_day: 1
  sqlite:
    busy_timeout_ms: 5000
    wal: true
  fetch:
    timeout_s: 25
    max_connections: 16
    max_keepalive: 8
    retries: 2
    jitter: 0.2

telegram:
  api_base: https://api.telegram.org
  token_env: TELEGRAM_BOT_TOKEN
  rate_per_min: 20
  poll_timeout_s: 50
  backup_fail_threshold: 3

commands:
  threshold_ttl_hours: 24
  mute_max_hours: 168

alerts:
  pin_critical: true
  # Empty list disables all "no /ack" reminders; add minutes (e.g. [10, 30]) to enable.
  critical_repeat_minutes: []
  edit_on_confirmation: true
  # Do not send another message while the event status is unchanged: same
  # cluster or tripwire, level and status fields (colour/ash/magnitude). The
  # open card is edited when new sources confirm it; after this window a fresh
  # reminder card is allowed.
  dedupe_unchanged: true
  dedupe_window_hours: 24
  # A WARNING/CRITICAL alert needs at least one cluster event at this score
  # (tripwire alerts bypass). Blocks theater-level alerts riding on unrelated news.
  min_cluster_score: 1.0
  # WARNING (L2) for these theaters still scores but is not delivered to Telegram.
  suppress_warning_theaters: [NATURE]
  # CRITICAL for these theaters is delivered once, without "no /ack" reminders.
  suppress_repeats_theaters: [NATURE]
  # BLUF: the first thing a reader needs is what to do at this level.
  guidance:
    WARNING: "Не планируйте поездки; гибкие билеты, наличные, документы."
    CRITICAL: "Рассмотрите выезд в ближайшие 48 ч, пока сообщение открыто; укрытие."
    overrides:
      NATURE:
        CRITICAL: "Следуйте указаниям местных служб."
      PANDEMIC:
        CRITICAL: "Следуйте рекомендациям органов здравоохранения."
      MARKETS:
        CRITICAL: "Проверьте позиции и ликвидность."
  disclaimer: "Это не распоряжение органов гражданской обороны. При расхождении следуйте официальным указаниям."

# Pre-send check: an OpenRouter model decides whether the alert claim matches
# the event. Any error or timeout fails open (the alert is sent as-is) so the
# pipeline never stops because of the provider. Requires OPENROUTER_API_KEY in
# the secrets file. Each verdict is stored in the alert_reviews table.
alert_review:
  enabled: true
  # enforce: non-matching alerts are withheld. shadow: log the verdict only.
  mode: enforce
  model: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
  url: https://openrouter.ai/api/v1/chat/completions
  timeout_s: 12
  max_tokens: 400
  max_body_chars: 1500
  min_level: 2

# Deterministic freshness gate: resolves the original article behind a Google
# News link and reads its own dates (JSON-LD, meta, page payload). An article
# published, uploaded or last modified before max_age_days is withheld as stale;
# a reset publication date (modified/upload far older than published) counts as
# stale too. Fetch or parse failures fail open. Verdicts go to alert_reviews
# with model deterministic-freshness.
alert_freshness:
  enabled: true
  # enforce: stale alerts are withheld. shadow: record the verdict only.
  mode: enforce
  max_age_days: 14
  timeout_s: 8
  max_bytes: 2000000
  max_article_chars: 1500
  min_level: 2

digest:
  # Individual events below this score are omitted from the digest lists.
  min_event_score: 1.0

translate:
  enabled: true
  providers: [google, mymemory]
  google_url: https://clients5.google.com/translate_a/t
  mymemory_url: https://api.mymemory.translated.net/get
  mymemory_email: ""
  target_lang: RU
  timeout_s: 3
  max_chars: 1200
  skip_langs: [ru, uk, be]

files:
  channels: channels.yaml
  sources: sources.yaml
  tripwires: tripwires.yaml
  lexicon: lexicon.yaml
  thresholds: thresholds.yaml
  geofences: geofences.yaml
  gazetteer: gazetteer.yaml
  pizza: pizza.yaml
