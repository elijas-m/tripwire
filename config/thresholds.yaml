modifiers:
  market_shock: 1.25
  ppi_anomaly: 1.15
  night: 1.2
  multi_theater: 1.2
  multi_theater_min_level: WATCH

market_shock:
  # 24h moves (percent) that make the markets indicator ANOMALY.
  brent_surge_pct: 7.0
  brent_spike_pct: 4.0
  gold_rally_pct: 3.0
  metal_drop_pct: 3.0
  # Gold/silver drops count only when VIX grows at least this much (24h).
  vix_confirm_pct: 20.0
  vix_spike_pct: 30.0
  vix_high: 35.0
  fx_drop_pct: 5.0

radiation:
  # Safecast µSv/h indicator: a device spikes when its recent reading exceeds
  # max(baseline * spike_factor, baseline + spike_delta_usv).
  baseline_hours: 3
  recent_minutes: 60
  min_samples: 5
  spike_factor: 3.0
  spike_delta_usv: 0.5
  extreme_usv: 10.0
  max_plausible_usv: 100.0

diplo_evac:
  # Embassy/consulate evacuation indicator over stored event titles.
  # ANOMALY when >= anomaly_countries countries within country_window_hours
  # or >= anomaly_clusters distinct events within window_hours.
  window_hours: 168
  country_window_hours: 72
  elevated_clusters: 1
  anomaly_clusters: 3
  anomaly_countries: 2
  max_matches: 5

