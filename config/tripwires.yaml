    why: "Полное закрытие воздушного пространства стран Залива — подготовка или начало ударов."
    one_liner: "Закрыто воздушное пространство страны Залива"

  # ---------------- Pandemic ----------------
  - id: TW-PAN-PHEIC
    type: regex
    theater: PANDEMIC
    level: CRITICAL
    cooldown_min: 720
    source_ids: [who_news_rss, who_don_odata, gnews_who]
    max_tier: 1
    regex: >-
      (?is)((\bdeclar\w+|\bdetermin\w+|объяв\w+|определ\w+).{0,120}(\bpublic health emergency of international concern\b|\bPHEIC\b|чрезвычайн\w+ ситуац\w+.{0,40}международн\w+ значения))
      |
      ((\bpublic health emergency of international concern\b|\bPHEIC\b).{0,120}(\bdeclar\w+|\bdetermin\w+|объяв\w+))
    negate_regex: '(?i)(not (a )?pheic|no longer|ended|terminat|не является|отменен|прекращен|2020|2022|historic)'
    why: "ВОЗ объявила ЧС международного значения — верхний уровень эпидемиологической тревоги."
    one_liner: "ВОЗ объявила PHEIC"
    horizon: structural
    refute: "Отмена режима ЧС ВОЗ."
    next_tripwire: "Объявление пандемии или подтверждённая устойчивая передача человек-человеку."

  - id: TW-PAN-PANDEMIC
    type: regex
    theater: PANDEMIC
    level: CRITICAL
    cooldown_min: 720
    source_ids: [who_news_rss, who_don_odata, gnews_who]
    max_tier: 1
    regex: >-
      (?is)((\bdirector[- ]general\b|\bгенеральн\w+ директор\b).{0,160}\b(pandemic|пандеми\w+)\b)
      |
      (\b(pandemic|пандеми\w+)\b.{0,100}(\bdeclar\w+|\bобъяв\w+))
    negate_regex: '(?i)(not a pandemic|no longer|isn.t|не является|не объявлена|historic|2009|1918|previous|прошл\w+)'
    why: "ВОЗ объявила пандемию — глобальная чрезвычайная ситуация."
    one_liner: "ВОЗ объявила пандемию"

  - id: TW-PAN-H2H
    type: regex
    theater: PANDEMIC
    level: CRITICAL
    cooldown_min: 720
    max_tier: 1
    regex: >-
      (?is)(\bsustained human[- ]to[- ]human transmission\b|устойчив\w+ передач\w+ от человека к человеку|הדבקה מתמשכת מאדם לאדם)
    negate_regex: '(?i)(no evidence|not confirmed|denied|опроверг|не подтвержд|אין ראיות)'
    why: "Устойчивая передача человек-человеку нового патогена — предпосылка пандемии."
    one_liner: "Подтверждена устойчивая передача человек-человеку"

